schema_version: 1
card:
  additional_fields: false
  fields:
    - schema_version
    - lesson_id
    - title
    - category
    - tags
    - applies_when
    - not_applicable_when
    - failure_signature
    - root_cause
    - confidence
    - detection
    - prevention
    - recovery
    - raw_evidence_summary
    - error_excerpt
    - enforcement
    - deterministic
    - reproducible
    - uncontested
    - source_fingerprint
    - created_sha
    - revised_sha
    - status
  categories: [methodology, data, metrics, implementation, environment, compute]
  enforcement: [BLOCK, WARN]
  status: [ACTIVE, CONTESTED, SUPERSEDED]
  confidence: [LOW, MEDIUM, HIGH]
  text_limits_bytes:
    title: 200
    tag: 64
    condition: 512
    failure_signature: 512
    root_cause: 2048
    action: 512
    raw_evidence_summary: 2048
    error_excerpt_line: 512
    source_fingerprint: 80
  list_limits:
    tags: 16
    applies_when: 16
    not_applicable_when: 16
    failure_signature: 16
    detection: 16
    prevention: 16
    recovery: 16
    error_excerpt_lines: 20
index:
  additional_fields: false
  fields: [schema_version, entries]
  entry_fields: [lesson_id, path, category, title, tags, enforcement, status]
